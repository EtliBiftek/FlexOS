---
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath: "/lib/kbd/keymaps/xkb"
writeEtcDefaultKeyboard: true

# Calamares maps the selected locale to the matching keyboard layout. The
# installer still lets the user override the detected choice before install.
guessLayout: true

configure:
  kwin: false
  gnome: false
