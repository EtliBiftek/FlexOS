---
check:
  - storage
  - ram
  - power
  - internet
  - root
  - screen
required:
  - ram

# Use Calamares' supported GeoIP lookup to pre-select the installer language.
# If the network is unavailable, Calamares keeps the live-session language.
geoip:
  style: "xml"
  url: "https://geoip.kde.org/v1/ubiquity"
  selector: "CountryCode"
