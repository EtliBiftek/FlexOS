# FlexOS desktop/gaming performance policy.
# Values are adapted from current CachyOS Settings where they are portable to Debian.

vm.swappiness = 100
vm.vfs_cache_pressure = 50
vm.dirty_bytes = 268435456
vm.page-cluster = 0
vm.dirty_background_bytes = 67108864
vm.dirty_writeback_centisecs = 1500

# Reduce watchdog overhead for the performance-oriented default profile.
kernel.nmi_watchdog = 0

# Preserve Debian desktop/container compatibility while restricting pointer disclosure.
kernel.unprivileged_userns_clone = 1
kernel.kptr_restrict = 2
kernel.printk = 3 3 3 3

net.core.netdev_max_backlog = 4096
fs.file-max = 2097152
