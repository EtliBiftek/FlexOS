name: Validate CachyOS Userspace Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'build.sh'
      - 'config/includes.chroot/**'
      - 'config/hooks/live/**'
      - 'packages/**'
      - 'scripts/fetch-cachyos-kernel.py'
      - 'scripts/validate-cachyos-stack.sh'
      - 'scripts/smoke-test-iso.sh'
      - 'scripts/qemu-boot-smoke.sh'
      - '.github/workflows/build-iso.yml'
      - '.github/workflows/validate-cachyos-userspace.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Normalize executable permissions
        run: chmod +x build.sh scripts/*.sh scripts/*.py config/hooks/live/*.hook.chroot || true
      - name: Validate source
        run: |
          ./scripts/validate.sh
          ./scripts/validate-cachyos-stack.sh
          bash -n build.sh
          bash -n scripts/smoke-test-iso.sh
          bash -n scripts/qemu-boot-smoke.sh
          grep -q 'flexos-cachy' scripts/qemu-boot-smoke.sh
          grep -q 'linux-image-amd64' scripts/smoke-test-iso.sh
          grep -q 'flexos-performance' scripts/smoke-test-iso.sh
          grep -q 'flexos-gaming' scripts/smoke-test-iso.sh
      - name: Build every FlexOS component package
        run: |
          PKGVER="0.5.0~ci$(date +%s)"
          python3 scripts/build-flexos-packages.py --output dist/packages-validation --package-version "$PKGVER" --product-version "$(cat VERSION)"
          test -f dist/packages-validation/flexos-performance_${PKGVER}_all.deb
          test -f dist/packages-validation/flexos-gaming_${PKGVER}_all.deb
          dpkg-deb --info dist/packages-validation/flexos-center_${PKGVER}_all.deb >/dev/null
