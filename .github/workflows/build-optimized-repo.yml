name: Build FlexOS Optimized Repository

on:
  workflow_dispatch:
    inputs:
      profile:
        description: CPU optimization profile
        required: true
        type: choice
        options: [x86-64-v3, x86-64-v4, zen4]
        default: x86-64-v3
      packages:
        description: Space-separated Debian source package names
        required: true
        default: 'zstd gamemode mangohud'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container: debian:13
    steps:
      - uses: actions/checkout@v4
      - name: Configure Debian source repositories
        run: |
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential devscripts dpkg-dev apt-utils gnupg git ca-certificates
      - name: Build selected sources with architecture flags
        env:
          PROFILE: ${{ inputs.profile }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -eux
          case "$PROFILE" in
            x86-64-v3) CFLAGS='-O2 -pipe -march=x86-64-v3 -mtune=generic' ;;
            x86-64-v4) CFLAGS='-O2 -pipe -march=x86-64-v4 -mtune=generic' ;;
            zen4) CFLAGS='-O2 -pipe -march=znver4 -mtune=znver4' ;;
            *) exit 2 ;;
          esac
          mkdir -p /workspace/out /workspace/src
          cd /workspace/src
          for pkg in $PACKAGES; do
            apt-get build-dep -y "$pkg"
            apt-get source "$pkg"
            dir="$(find . -mindepth 1 -maxdepth 1 -type d -name "${pkg}*" | sort | tail -n1)"
            test -n "$dir"
            cd "$dir"
            DEB_BUILD_OPTIONS='nocheck parallel='"$(nproc)" \
            DEB_CFLAGS_MAINT_APPEND="$CFLAGS" DEB_CXXFLAGS_MAINT_APPEND="$CFLAGS" \
              dpkg-buildpackage -b -uc -us
            cd ..
            find . -maxdepth 1 -type f -name '*.deb' -exec mv -t /workspace/out {} +
          done
      - name: Build signed APT repository
        env:
          FLEXOS_APT_GPG_PRIVATE_KEY: ${{ secrets.FLEXOS_APT_GPG_PRIVATE_KEY }}
          FLEXOS_APT_GPG_KEY_ID: ${{ secrets.FLEXOS_APT_GPG_KEY_ID }}
          FLEXOS_APT_GPG_PASSPHRASE: ${{ secrets.FLEXOS_APT_GPG_PASSPHRASE }}
        run: |
          set -eux
          test -n "${FLEXOS_APT_GPG_PRIVATE_KEY:-}" || { echo 'APT signing key is required for publication.' >&2; exit 1; }
          printf '%s' "$FLEXOS_APT_GPG_PRIVATE_KEY" | gpg --batch --import
          root=/workspace/repo
          mkdir -p "$root/pool/main" "$root/dists/beta/main/binary-amd64"
          cp /workspace/out/*.deb "$root/pool/main/"
          cd "$root"
          dpkg-scanpackages --multiversion pool/main /dev/null > dists/beta/main/binary-amd64/Packages
          gzip -9kc dists/beta/main/binary-amd64/Packages > dists/beta/main/binary-amd64/Packages.gz
          apt-ftparchive release dists/beta > dists/beta/Release
          gpg --batch --yes --pinentry-mode loopback --passphrase "${FLEXOS_APT_GPG_PASSPHRASE:-}" \
            --local-user "$FLEXOS_APT_GPG_KEY_ID" --clearsign -o dists/beta/InRelease dists/beta/Release
          gpg --batch --yes --pinentry-mode loopback --passphrase "${FLEXOS_APT_GPG_PASSPHRASE:-}" \
            --local-user "$FLEXOS_APT_GPG_KEY_ID" -abs -o dists/beta/Release.gpg dists/beta/Release
      - name: Publish optimized APT branch
        env:
          PROFILE: ${{ inputs.profile }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          case "$PROFILE" in x86-64-v3) branch=apt-v3;; x86-64-v4) branch=apt-v4;; zen4) branch=apt-zen4;; esac
          cd /workspace/repo
          git init
          git checkout -b "$branch"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add . && git commit -m "Publish FlexOS $PROFILE optimized repository"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "$branch"
      - name: Upload optimized packages
        uses: actions/upload-artifact@v4
        with:
          name: FlexOS-${{ inputs.profile }}-packages-${{ github.sha }}
          path: /workspace/out/*.deb
          retention-days: 30
